[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/extract",
    "crates/ebook",
    "crates/orchestrator",
    "crates/cli",
    "crates/gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Unlicense"
rust-version = "1.88"

[workspace.dependencies]
pdf-to-ebook-core         = { path = "crates/core" }
pdf-to-ebook-extract      = { path = "crates/extract" }
pdf-to-ebook-ebook        = { path = "crates/ebook" }
pdf-to-ebook-orchestrator = { path = "crates/orchestrator" }

anyhow      = "1"
thiserror   = "2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tracing     = "0.1"
log         = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
